\* TLC config for MODULE GaleFederatedLeasing.
\* Three regions, Limit 6, Batch 3: the static-partition baseline would
\* under-pool at K*(Limit/K) = Limit under perfect symmetry, but the
\* carryover (non-coupled) baseline would scale Delta to K*(Batch-1) = 6.
\* Window-coupled federation holds  admitted <= Limit = 6  regardless of K.
\*
\* By the relabeling argument (DESIGN.md Section 4), this configuration's
\* distinct-state count is numerically identical to GaleWindowCoupled-
\* Leasing.cfg at  Nodes={n1,n2,n3}, Limit=6, Batch=3. Both specs share an
\* isomorphic transition system; the JS BFS twin (introduced by TK-905)
\* reproduces the count in CI without Java.
CONSTANTS
    Regions = {us_east, eu_west, ap_south}
    Limit = 6
    Batch = 3

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    Overshoot

\* To capture the tightness counterexample (admitted reaches Limit), swap in:
\* INVARIANTS TypeOK OvershootTight
