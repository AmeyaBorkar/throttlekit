\* TLC config for MODULE GaleWindowCoupledLeasing.
\* Three nodes, Limit 6, Batch 3: DistributedLeasing's baseline bound here is
\* Limit + N*(Batch-1) = 6 + 3*2 = 12, but window-coupling holds admitted <= 6
\* (Overshoot) regardless of N. Vary Nodes to see the bound stay at Limit.
CONSTANTS
    Nodes = {n1, n2, n3}
    Limit = 6
    Batch = 3

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    Overshoot

\* To capture the tightness counterexample (admitted reaches Limit), swap in:
\* INVARIANTS TypeOK OvershootTight
