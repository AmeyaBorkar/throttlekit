\* TLC config for MODULE GaleHeartbeatHandoff (the ASYNC acknowledged-handoff model).
\* Two nodes; constant global budget L = 4 (one heartbeat epoch); K = 3 outstanding
\* grants per node. Staggered Reallocate/Deliver/Report + Join/Leave over {n1,n2}
\* exercise the committed-vs-applied gap, reporting lag, and non-revocable drain.
\* CONSTRAINT bounds the per-node grant history so the state space is finite.
CONSTANTS
    Nodes = {n1, n2}
    L = 4
    K = 3

INIT Init
NEXT Next

CONSTRAINT StateBound

INVARIANTS
    TypeOK
    GlobalCap
    InflightCap

\* To capture a tightness counterexample (Sum reaches L, so L is the least upper
\* bound -- the hard async bound loses no steady-state capacity), swap in a witness:
\* INVARIANTS TypeOK GlobalCapTight
\* INVARIANTS TypeOK InflightCapTight
