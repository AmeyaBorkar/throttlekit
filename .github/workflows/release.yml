name: Release

# Publishes to npm when a version tag is pushed (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Requires an `NPM_TOKEN` repository secret (an npm automation token with publish rights). Without
# it the job still runs the gate and build, then skips the publish step with a notice — so tagging
# is always safe.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release for the tag
  id-token: write # for npm provenance attestations

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Publish to npm (with provenance)
        if: ${{ env.HAS_NPM_TOKEN == 'true' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish skipped (no NPM_TOKEN)
        if: ${{ env.HAS_NPM_TOKEN != 'true' }}
        run: |
          echo "::notice title=npm publish skipped::Set the NPM_TOKEN repository secret (an npm automation token), then re-run this workflow or push the tag again to publish."
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Pull this version's section out of the CHANGELOG; fall back to auto-generated notes.
          notes="$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice title=release exists::$tag already has a GitHub Release; leaving it as-is."
          elif [ -n "$notes" ]; then
            gh release create "$tag" --title "$tag" --notes "$notes"
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
