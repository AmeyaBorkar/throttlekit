name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      THROTTLEKIT_TEST_REDIS: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  bench-gate:
    name: Bench regression gate
    runs-on: ubuntu-latest
    # Blocking. The gate compares a MACHINE-INDEPENDENT metric — each strategy's checkSync cost
    # normalised to an in-run reference loop (see bench/gate.ts) — so the win32-recorded
    # bench/baseline.json is valid on this ubuntu runner and shared-runner speed variance cancels
    # in the ratio. A failure here is a real relative hot-path regression, not a slow runner; that
    # is what makes it safe to block merges (no `continue-on-error`).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run bench:gate
        run: npm run bench:gate
        env:
          # Relative threshold: fail when a row's normalised cost grows > 25% vs baseline. Sized to
          # clear best-of-N jitter (~5% observed) + the cross-arch reference-mix residual, while
          # still catching the deopts this gate exists for (hot-path megamorphism etc. are ≥50%).
          # Tighten toward 1.15 once CI history confirms the relative spread on this runner is small.
          BENCH_REGRESSION_THRESHOLD: "1.25"
