name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  package:
    name: Package surface (publint + attw)
    runs-on: ubuntu-latest
    # Locks the 24-subpath × ESM/CJS .d.ts/.d.cts resolution matrix. publint checks the published
    # manifest (exports/main/types correctness); attw (--profile node16) verifies every subpath
    # resolves to the right declarations under node16 + bundler resolution. Blocking: a freeze whose
    # type-resolution silently rots is not frozen. node10 is intentionally out of scope (engines.node
    # >=18; the exports map is not legacy-node-resolvable by design).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run publint
      - run: npm run attw

  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      THROTTLEKIT_TEST_REDIS: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  bench-gate:
    name: Bench regression gate
    runs-on: ubuntu-latest
    # Blocking. The gate compares a MACHINE-INDEPENDENT metric — each strategy's checkSync cost
    # normalised to an in-run reference loop (see bench/gate.ts) — so the win32-recorded
    # bench/baseline.json is valid on this ubuntu runner and shared-runner speed variance cancels
    # in the ratio. A failure here is a real relative hot-path regression, not a slow runner; that
    # is what makes it safe to block merges (no `continue-on-error`).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run bench:gate
        run: npm run bench:gate
        env:
          # Relative threshold: fail when a row's normalised cost grows > 50% vs baseline. The
          # win32-recorded baseline read here on ubuntu carries a MEASURED systematic ~20-30%
          # cross-OS reference-mix residual (the clock read is much cheaper on Linux), so 1.5 clears
          # it while still catching the deopts this gate exists for (hot-path megamorphism is ~3× =
          # +200%). For a tighter gate, record the baseline on this OS, or diff against the base commit.
          BENCH_REGRESSION_THRESHOLD: "1.5"
