name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  package:
    name: Package surface (publint + attw)
    runs-on: ubuntu-latest
    # Locks the 24-subpath × ESM/CJS .d.ts/.d.cts resolution matrix. publint checks the published
    # manifest (exports/main/types correctness); attw (--profile node16) verifies every subpath
    # resolves to the right declarations under node16 + bundler resolution. Blocking: a freeze whose
    # type-resolution silently rots is not frozen. node10 is intentionally out of scope (engines.node
    # >=18; the exports map is not legacy-node-resolvable by design).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run publint
      - run: npm run attw

  wire:
    name: Wire contract (buf breaking + lint)
    runs-on: ubuntu-latest
    # The gRPC service door (wire/throttlekit.proto) is a public, multi-language contract: a client built
    # today must keep working forever. buf breaking (FILE) fails the build on ANY non-additive change
    # (renumber / retype / remove / cardinality) vs the committed baseline image (wire/throttlekit.baseline.binpb),
    # so the v1 wire can only grow additively; buf lint holds new services to STANDARD (the frozen
    # RateLimiter naming + the wire/ layout are excepted in buf.yaml). The server's shipped throttlekit.proto
    # is generated verbatim from this source at pack time, so validating the source covers what ships.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run wire:lint
      - run: npm run wire:breaking

  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      THROTTLEKIT_TEST_REDIS: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  live-store:
    name: Live-store gate (Redis + Postgres + DynamoDB)
    runs-on: ubuntu-latest
    # The store-gated suites prove the headline claim — one transform, bit-identical across
    # in-memory / Redis / Postgres — against REAL backends, plus the server's live-backend gRPC e2e.
    # The `test` matrix above runs storeless + Redis only (the fast publish gate); every other store
    # suite `describe.skip`s when its THROTTLEKIT_TEST_* URL is unset, so without this job the
    # cross-store-equivalence, Postgres store/coordinator, region-fair-pool, and server Postgres/DynamoDB
    # e2e tests never execute in CI. One Node version (the store paths are not node-version-sensitive)
    # keeps container cost flat; `--no-file-parallelism` serialises the Postgres/DynamoDB suites (Redis
    # tests pin a per-file logical DB and parallelise safely, but the flag is harmless for them).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: throttlekit
          POSTGRES_PASSWORD: throttlekit
          POSTGRES_DB: throttlekit
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    env:
      THROTTLEKIT_TEST_REDIS: redis://localhost:6380
      THROTTLEKIT_TEST_POSTGRES: postgres://throttlekit:throttlekit@localhost:5433/throttlekit
      THROTTLEKIT_TEST_DYNAMODB: http://localhost:8000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for DynamoDB local
        # amazon/dynamodb-local ships no shell/health tooling, so a service `--health-cmd` is impossible;
        # poll the HTTP port instead. A reachable listener answers a bare GET with HTTP 400, so curl exits
        # 0 once it is up and non-zero only while the connection is refused.
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8000; then echo "dynamodb-local is up"; exit 0; fi
            sleep 1
          done
          echo "::error::dynamodb-local did not become reachable on :8000"
          exit 1
      - name: Core store-gated suite (Redis + Postgres)
        run: npx vitest run --no-file-parallelism
      - name: Server live-backend e2e (Postgres + DynamoDB)
        working-directory: server
        run: |
          npm ci
          npm run build
          npm test

  bench-gate:
    name: Bench regression gate
    runs-on: ubuntu-latest
    # Blocking. The gate compares a MACHINE-INDEPENDENT metric — each strategy's checkSync cost
    # normalised to an in-run reference loop (see bench/gate.ts) — so the win32-recorded
    # bench/baseline.json is valid on this ubuntu runner and shared-runner speed variance cancels
    # in the ratio. A failure here is a real relative hot-path regression, not a slow runner; that
    # is what makes it safe to block merges (no `continue-on-error`).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run bench:gate
        # The threshold, the cross-OS reference-mix residual rationale, and the sub-ns noise floor all
        # live in bench/gate.ts (default 2.0 — the win32 baseline read on ubuntu carries a measured
        # ~50% residual since the clock read is far cheaper on Linux, and clock-free sub-30ns rows like
        # `lease spend` are reported but not gated). No env override here ⇒ bench/gate.ts is the single
        # source of truth. A failure is a real relative hot-path regression, not a slow runner.
        run: npm run bench:gate

  server:
    name: Server (gRPC door)
    runs-on: ubuntu-latest
    # The throttlekit-server package (the polyglot service door). It builds against the PUBLISHED
    # throttlekit — dogfooding the frozen 1.0 public API, never the core's source — and runs its gRPC
    # e2e + runtime tests in-process (memory store + a ManualClock; no external services needed). The
    # server versions/releases on its own pre-1.0 cadence; this job just keeps it green with the core.
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
