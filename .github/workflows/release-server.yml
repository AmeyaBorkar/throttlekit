name: Release server

# Publishes the throttlekit-server package to npm when a `server-v*` tag is pushed, e.g.
#   git tag server-v0.1.0-experimental.0 && git push origin server-v0.1.0-experimental.0
# It reuses the repo's NPM_TOKEN secret (the same automation token the core release uses). Without
# the token the job still builds + tests, then skips the publish with a notice — so tagging is always
# safe. The core release (`v*` tags) and this one (`server-v*` tags) never collide.

on:
  push:
    tags:
      - "server-v*"

permissions:
  contents: write # create the prerelease GitHub Release for the server-v* tag
  id-token: write # npm provenance attestations

jobs:
  publish:
    name: Build & publish (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Publish to npm (with provenance)
        if: ${{ env.HAS_NPM_TOKEN == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set +e
          out=$(npm publish --provenance --access public 2>&1)
          code=$?
          echo "$out"
          [ "$code" -eq 0 ] && exit 0
          # npm occasionally 403s a *duplicate PUT* after a successful publish (a known --provenance flow
          # hiccup — the tarball + provenance already landed). So "cannot publish over the previously
          # published versions" WITH the version actually live on the registry is a success, not a failure.
          version="${TAG#server-v}"
          if echo "$out" | grep -q "cannot publish over the previously published versions" \
             && [ "$(npm view "throttlekit-server@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::notice title=publish::$version is live on npm — treating the duplicate-PUT 403 as success."
            exit 0
          fi
          exit "$code"
      - name: Publish skipped (no NPM_TOKEN)
        if: ${{ env.HAS_NPM_TOKEN != 'true' }}
        run: echo "::notice title=npm publish skipped::Set the NPM_TOKEN repository secret, then re-push the server-v* tag to publish throttlekit-server."
      - name: Create (or update) the GitHub Release for this tag
        # The server is experimental and versions independently of the core `throttlekit` (`v*` tags), so
        # its Release is always a **pre-release** — it shows on the Releases page alongside the core line
        # without ever taking the "Latest" badge from it. Idempotent: a re-pushed tag updates the Release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#server-v}"
          # Pull the CHANGELOG block for this version (literal prefix match, not regex — see the py repo's
          # release.yml for why). The job's working-directory is `server/`, so CHANGELOG.md is the server's.
          NOTES=$(awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1               { capture=1; next }
            capture && index($0, "## [") == 1 { exit }
            capture                           { print }
          ' CHANGELOG.md)
          NOTES_FILE="$(mktemp)"
          {
            if printf '%s' "$NOTES" | grep -q '[^[:space:]]'; then
              printf '%s\n\n' "$NOTES"
            else
              printf 'throttlekit-server %s. See [CHANGELOG.md](CHANGELOG.md).\n\n' "$VERSION"
            fi
            printf 'Install: `npm i throttlekit-server@%s`\n' "$VERSION"
          } > "$NOTES_FILE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "throttlekit-server $VERSION" --notes-file "$NOTES_FILE" --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "throttlekit-server $VERSION" --notes-file "$NOTES_FILE" --prerelease --verify-tag
          fi
